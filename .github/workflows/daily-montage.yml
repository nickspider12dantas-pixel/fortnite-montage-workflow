name: Daily Fortnite montage

on:
  workflow_dispatch:
    inputs:
      run_autoclip:
        description: "Submit approved footage to AutoClip (may use quota; default is off)"
        required: true
        type: boolean
        default: false
  schedule:
    # 5:30 PM America/New_York is 21:30 UTC during daylight time.
    # GitHub cron is UTC, so this shifts by an hour when DST changes.
    - cron: "30 21 * * *"

permissions:
  contents: read

concurrency:
  group: daily-fortnite-montage
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate original free soundtrack
        run: python scripts/generate_music.py

      - name: Check setup without making API calls
        id: readiness
        env:
          RUN_AUTOCLIP: ${{ github.event_name == 'workflow_dispatch' && inputs.run_autoclip == true }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(".")
          sources = json.loads((root / "sources.json").read_text(encoding="utf-8")).get("clips", [])
          music = json.loads((root / "music.json").read_text(encoding="utf-8"))
          music_file = str(music.get("music_file", "")).strip()
          music_url = str(music.get("music_url", "")).strip()
          license_note = str(music.get("license_note", "")).strip()
          music_ready = bool(license_note) and (
              (bool(music_file) and (root / music_file).is_file()) or
              music_url.startswith("https://")
          )
          if os.environ.get("RUN_AUTOCLIP", "").lower() == "true":
              footage_ready = any(
                  clip.get("approved") is True and
                  str(clip.get("source_page") or clip.get("url") or "").startswith("https://")
                  for clip in sources
              )
          else:
              footage_ready = len([
                  clip for clip in sources
                  if clip.get("approved") is True and (
                      str(clip.get("url", "")).startswith("https://") or
                      (str(clip.get("file", "")).strip() and
                       (root / str(clip.get("file", "")).strip()).is_file())
                  )
              ]) >= 2
          ready = footage_ready and music_ready
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ready={'true' if ready else 'false'}\n")
          if not ready:
              print("Setup incomplete. No AutoClip jobs will be submitted and no montage will be built.")
              print("Add at least two authorized direct video URLs (or enable AutoClip only after checking quota), then run again.")
          else:
              print("Setup checks passed.")
          PY

      - name: Generate clips with AutoClip (explicit opt-in only)
        if: steps.readiness.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.run_autoclip == true
        env:
          AUTOCLIP_API_KEY: ${{ secrets.AUTOCLIP_API_KEY }}
        run: python scripts/autoclip_fetch.py

      - name: Build montage
        if: steps.readiness.outputs.ready == 'true'
        env:
          MONTAGE_SOURCES_FILE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_autoclip == true && 'output/autoclip_sources.json' || 'sources.json' }}
        run: python scripts/build_montage.py

      - name: Upload finished montage
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fortnite-montage-${{ github.run_number }}
          path: output/montage.mp4
          if-no-files-found: error
          retention-days: 7
